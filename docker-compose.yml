version: "3.8"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./accounts:/home/appuser/app/accounts
      - ./cookies:/home/appuser/app/cookies
      - ./profiles:/home/appuser/app/profiles
      - ./screenshots:/home/appuser/app/screenshots
      - ./logs:/home/appuser/app/logs
      - ./results:/home/appuser/app/results
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
